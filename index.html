<!doctype html>
<html lang="zh-CN" data-theme="midnight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>md2html — Markdown 报告转换器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>
  <div class="app">
    <!-- TOP BAR -->
    <div class="topbar">
      <div class="brand">
        <b>md2html</b>
        <span>Report Converter</span>
      </div>
      <div class="spacer"></div>
      <input type="file" id="file-input" accept=".md,.markdown,.txt" style="display:none">
      <button class="tbtn" id="import-btn">导入 .md</button>
      <select class="theme-select" id="theme-select">
        <option value="midnight">Midnight</option>
        <option value="parchment">Parchment</option>
        <option value="academic">Academic</option>
        <option value="apple">Apple</option>
        <option value="terminal">Terminal</option>
        <option value="slate">Slate</option>
      </select>
      <button class="tbtn primary" id="export-btn">导出 HTML</button>
    </div>
    <!-- CANVAS -->
    <div class="canvas">
      <div class="report-page">
        <div id="report-content">
          <div class="loading">正在加载报告…</div>
        </div>
      </div>
    </div>
  </div>

  <!-- VENDOR SCRIPTS -->
  <script src="vendor/marked.min.js"></script>
  <script>
    window.__hlCjs = { module: window.module, exports: window.exports, define: window.define };
    window.module = undefined; window.exports = undefined; window.define = undefined;
  </script>
  <script src="vendor/highlight.min.js"></script>
  <script>
    window.module = window.__hlCjs.module;
    window.exports = window.__hlCjs.exports;
    window.define = window.__hlCjs.define;
    delete window.__hlCjs;
  </script>
  <script src="vendor/abap.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>

  <!-- MAIN SCRIPT -->
  <script>
    "use strict";
    (function () {
      let currentMdText = "";

      function cssVar(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      function syncMermaidTheme() {
        const bg = cssVar("--bg") || "#0e1015";
        const isDark = (() => {
          const hex = bg.replace("#", "");
          if (hex.length === 6) {
            const r = parseInt(hex.slice(0,2), 16);
            const g = parseInt(hex.slice(2,4), 16);
            const b = parseInt(hex.slice(4,6), 16);
            return (r + g + b) / 3 < 128;
          }
          return false;
        })();

        const lineCol = isDark ? (cssVar("--muted") || "#69707d") : "#666";
        const nodeFill = cssVar("--code-header-bg") || (isDark ? "#1e2128" : "#eeeef0");
        const nodeText = cssVar("--heading") || (isDark ? "#e8eaf0" : "#111");
        const nodeBorder = cssVar("--border") || (isDark ? "#3a3d45" : "#d1d5db");
        const lblBg = cssVar("--mermaid-bg") || (isDark ? "#0c0e13" : "#f7f7f9");
        const txtCol = cssVar("--text") || (isDark ? "#c8cad3" : "#1a1a1a");
        const accentCol = cssVar("--accent") || (isDark ? "#818cf8" : "#1e40af");

        try {
          mermaid.initialize({
            startOnLoad: false,
            theme: "base",
            themeVariables: {
              fontFamily: "Inter, Noto Sans SC, sans-serif",
              fontSize: "14px",
              lineColor: lineCol,
              textColor: txtCol,
              background: lblBg,
              mainBkg: nodeFill,
              primaryColor: nodeFill,
              primaryTextColor: nodeText,
              primaryBorderColor: accentCol,
              secondaryColor: nodeFill,
              tertiaryColor: nodeFill,
              edgeLabelBackground: lblBg,
              clusterBkg: lblBg,
              clusterBorder: nodeBorder,
            },
            securityLevel: "loose",
            flowchart: { useMaxWidth: true, htmlLabels: true, curve: "basis" },
            sequence: { useMaxWidth: true, actorMargin: 50, boxMargin: 10 },
          });
        } catch (e) {
        }
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function addIndentation(container) {
        const children = Array.from(container.children);
        let wrap3 = null;
        let wrap4 = null;
        for (const el of children) {
          const tag = el.tagName;
          if (tag === "H1" || tag === "H2") {
            wrap3 = null;
            wrap4 = null;
          } else if (tag === "H3") {
            wrap4 = null;
            wrap3 = document.createElement("div");
            wrap3.className = "section-h3";
            container.insertBefore(wrap3, el);
            wrap3.appendChild(el);
          } else if (tag === "H4") {
            wrap4 = null;
            wrap4 = document.createElement("div");
            wrap4.className = "section-h4";
            el.parentNode.insertBefore(wrap4, el);
            wrap4.appendChild(el);
            if (wrap3 && wrap4.parentNode !== wrap3) {
              wrap3.appendChild(wrap4);
            }
          } else {
            if (wrap4) wrap4.appendChild(el);
            else if (wrap3) wrap3.appendChild(el);
          }
        }
      }

      const renderer = {
        code({ text, lang }) {
          const escaped = escapeHtml(text);
          if (lang === "mermaid") {
            return `<div class="mermaid">${escaped}</div>`;
          }
          const langLabel = lang || "text";
          const langClass = lang ? `language-${lang}` : "language-text";
          return `<div class="code-block">
            <div class="code-header"><span>${langLabel.toUpperCase()}</span></div>
            <pre><code class="${langClass}">${escaped}</code></pre>
          </div>`;
        },
        heading({ text, depth }) {
          const slug = text.replace(/<[^>]+>/g, "").trim()
            .toLowerCase().replace(/[^\w\u4e00-\u9fff]+/g, "-").replace(/^-|-$/g, "");
          let cls = "";
          if (depth === 2) {
            if (/🔴|P0/i.test(text)) cls = " priority-p0";
            else if (/🟠|P1/i.test(text)) cls = " priority-p1";
            else if (/🟡|P2/i.test(text)) cls = " priority-p2";
            else if (/🟢|P3/i.test(text)) cls = " priority-p3";
          }
          return `<h${depth} id="${slug}" class="${cls.trim()}">${text}</h${depth}>`;
        },
      };
      marked.use({ renderer, gfm: true, breaks: false });

      async function renderMarkdown(mdText) {
        currentMdText = mdText;
        const container = document.getElementById("report-content");
        container.innerHTML = '<div class="loading">正在渲染…</div>';

        syncMermaidTheme();

        let html = marked.parse(mdText);
        container.innerHTML = html;

        container.querySelectorAll("table").forEach((table) => {
          if (table.parentElement.classList.contains("table-wrap")) return;
          const wrap = document.createElement("div");
          wrap.className = "table-wrap";
          table.parentNode.insertBefore(wrap, table);
          wrap.appendChild(table);
        });

        addIndentation(container);

        container.querySelectorAll("pre code").forEach((block) => {
          if (block.classList.contains("language-mermaid")) return;
          try {
            hljs.highlightElement(block);
          } catch (e) {
          }
        });

        const mermaidDivs = container.querySelectorAll(".mermaid");
        for (let i = 0; i < mermaidDivs.length; i++) {
          const div = mermaidDivs[i];
          const code = div.textContent;
          try {
            const id = "mmd-" + Date.now() + "-" + i;
            const result = await mermaid.render(id, code);
            const svg = typeof result === "string" ? result : (result.svg || "");
            if (svg) {
              div.innerHTML = svg;
            } else {
              throw new Error("mermaid.render returned empty result");
            }
          } catch (e) {
            div.className = "mermaid-error";
            div.innerHTML = '<strong>Mermaid \u6e32\u67d3\u5931\u8d25:</strong><pre>' + escapeHtml(String(e.message || e)) + '</pre>';
          }
        }
      }

      async function loadFile(url) {
        try {
          const resp = await fetch(url);
          if (resp.ok) return await resp.text();
        } catch (e) {
        }
        try {
          return await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);
            xhr.overrideMimeType("text/plain; charset=utf-8");
            xhr.onload = () => {
              if (xhr.status === 0 || xhr.status === 200) resolve(xhr.responseText);
              else reject(new Error("HTTP " + xhr.status));
            };
            xhr.onerror = () => reject(new Error("XHR failed"));
            xhr.send();
          });
        } catch (e) {
          showEmpty("无法自动加载报告文件。请点击「导入 .md」按钮手动选择文件。");
          return null;
        }
      }

      function showEmpty(msg) {
        document.getElementById("report-content").innerHTML =
          `<div class="empty-state">
            <div class="icon">📄</div>
            <p>未加载报告</p>
            <div class="hint">${msg || "点击「导入 .md」加载文件"}</div>
          </div>`;
      }

      const themeSelect = document.getElementById("theme-select");
      themeSelect.addEventListener("change", async (e) => {
        document.documentElement.dataset.theme = e.target.value;
        if (currentMdText) {
          await renderMarkdown(currentMdText);
        }
      });

      const fileInput = document.getElementById("file-input");
      document.getElementById("import-btn").addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const text = await file.text();
        await renderMarkdown(text);
        fileInput.value = "";
      });

      const canvas = document.querySelector(".canvas");
      canvas.addEventListener("dragover", (e) => { e.preventDefault(); });
      canvas.addEventListener("drop", async (e) => {
        e.preventDefault();
        const file = e.dataTransfer.files[0];
        if (!file || !/\.(md|markdown|txt)$/i.test(file.name)) return;
        const text = await file.text();
        await renderMarkdown(text);
      });

      document.getElementById("export-btn").addEventListener("click", exportHtml);

      function collectCss() {
        let css = "";
        for (const sheet of document.styleSheets) {
          try {
            const rules = sheet.cssRules;
            if (!rules) continue;
            for (const rule of rules) {
              css += rule.cssText + "\n";
            }
          } catch (e) {
          }
        }
        return css;
      }

      async function exportHtml() {
        const theme = document.documentElement.dataset.theme;
        const reportHtml = document.getElementById("report-content").innerHTML;
        const allCss = collectCss();

        const h1 = reportHtml.match(/<h1[^>]*>(.*?)<\/h1>/i);
        const title = h1 ? h1[1].replace(/<[^>]+>/g, "").trim() : "report";

        const html = `<!doctype html>
<html lang="zh-CN" data-theme="${theme}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${title}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700;800;900&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
${allCss}

body { overflow: auto; }
.app { display: block; height: auto; }
.canvas { overflow: visible; padding: 24px; }
.report-page { max-width: 860px; margin: 0 auto; }
</style>
</head>
<body>
<div class="app">
<div class="canvas">
<div class="report-page">
<div id="report-content">
${reportHtml}
</div>
</div>
</div>
</div>
</body>
</html>`;

        const blob = new Blob([html], { type: "text/html;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = title + ".html";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
      }

      (async function init() {
        const md = await loadFile("zalvtree-report.md");
        if (md) await renderMarkdown(md);
      })();
    })();
  </script>
</body>
</html>
